<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị MU Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #04070d; color: #e6edf7; font-family: Montserrat, system-ui, sans-serif; }
  a { color: #3b82f6; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #1d2a3c; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .layout { display: flex; min-height: 100vh; align-items: stretch; }

  /* ---- Sidebar ---- */
  .side { width: 250px; flex: none; background: linear-gradient(180deg, #080d16, #060a11); border-right: 1px solid #1d2a3c; padding: 20px 14px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .brand h1 { margin: 0; font-family: Grenze, Montserrat, serif; font-size: 21px; font-weight: 700; color: #f59e0b; letter-spacing: 1.5px; line-height: 1.15; }
  .brand .sub { color: #9fb0c6; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }
  .who-chip { background: #0c131d; border: 1px solid #1d2a3c; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #9fb0c6; }
  .who-chip:empty { display: none; }
  nav#tabs { display: flex; flex-direction: column; gap: 3px; }
  .nav-group { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #5f7288; margin: 12px 6px 4px; }
  .nav-group:first-child { margin-top: 2px; }
  nav#tabs button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; color: #c7d2e4; border: 1px solid transparent; border-radius: 10px; padding: 9px 12px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
  nav#tabs button .ic { width: 20px; text-align: center; flex: none; }
  nav#tabs button:hover { background: #0e1622; color: #fff; }
  nav#tabs button.active { background: linear-gradient(90deg, #f59e0b, #d97706); color: #04070d; border-color: #f59e0b; font-weight: 800; box-shadow: 0 4px 14px rgba(245,158,11,.25); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #16202f; }
  .side-foot .btn { width: 100%; }

  /* ---- Content ---- */
  main { flex: 1; min-width: 0; width: 100%; max-width: 1240px; margin: 0 auto; padding: 24px 28px 48px; }
  section { display: none; }
  section.active { display: block; animation: fadein .18s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card { background: #0a1018; border: 1px solid #16202f; border-radius: 14px; padding: 18px; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid #16202f; font-size: 17px; color: #fbbf24; letter-spacing: .3px; }
  .card h3 { margin: 14px 0 8px; font-size: 15px; color: #e6edf7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat { background: linear-gradient(180deg, #0d1521, #0a111c); border: 1px solid #1d2a3c; border-radius: 12px; padding: 16px; }
  .stat .num { font-size: 30px; font-weight: 800; color: #f59e0b; line-height: 1.1; }
  .stat-compact { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
  .stat-compact .stat { padding: 9px 12px; border-radius: 10px; }
  .stat-compact .num { font-size: 20px; }
  .stat-compact .lbl { font-size: 11px; margin-top: 2px; }
  .stat .lbl { color: #9fb0c6; font-size: 12px; margin-top: 5px; }
  .stat.warn-red { border-color: #b91c1c; background: #2a0a0a; }
  .stat.warn-red .num { color: #f87171; }
  .stat.warn-yellow { border-color: #f59e0b; background: #2a1503; }
  .stat.warn-yellow .num { color: #fbbf24; }

  /* ---- Tables ---- */
  #acc-list, #char-list, #item-search-list, #item-log-list, #blocked-list, #dupe-list,
  #shop-list, #news-list, #menu-list, #modules-list, #audit-list, #alogin-list,
  #events-list { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #16202f; vertical-align: top; }
  th { color: #9fb0c6; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; }
  tbody tr:hover td, tr:hover td { background: rgba(245,158,11,.045); }
  td .btn { padding: 5px 10px; font-size: 12px; border-radius: 7px; margin: 1px 0; }
  td.acc-act { white-space: nowrap; }
  .acc-admin-name { color: #f87171; font-weight: 700; }

  /* ---- Character detail (2026-11-15) ---- */
  #char-list tr.char-row { cursor: pointer; }
  .acc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .acc-avatar { width: 42px; height: 42px; flex: none; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #b45309); color: #04070d; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(245,158,11,.3); }
  .acc-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
  .acc-name b { font-size: 16px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc-id { color: #5f7288; font-size: 12px; font-weight: 700; flex: none; }
  .acc-pills { display: flex; gap: 6px; flex-wrap: wrap; order: 3; flex-basis: 100%; margin-left: 54px; justify-content: flex-start; }
  @media (min-width: 760px) { .acc-pills { order: 0; flex-basis: auto; margin-left: auto; justify-content: flex-end; } }
  .pill.acc-on { background: #14532d; color: #4ade80; display: inline-flex; align-items: center; gap: 6px; }
  .pill.acc-on .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: accpulse 1.8s infinite; }
  @keyframes accpulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.55); } 70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
  .pill.acc-admin { background: #3b2f0b; color: #fbbf24; }
  .pill.acc-dim { background: #1e293b; color: #c7d2e4; }
  .acc-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px 14px; }
  .acc-meta label { display: block; font-size: 10px; color: #5f7288; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 2px; }
  .acc-meta span { font-size: 13px; color: #e6edf7; word-break: break-all; }
  .acc-meta-flat { }
  .grant-warn { color: #f87171; font-weight: 700; margin-top: 10px; }
  .grant-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .grant-head h2 { margin: 0; }
  .grant-chev { color: #f5b942; font-size: 12px; font-weight: 700; flex: none; }
  .grant-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .grant-item { display: flex; gap: 6px; align-items: center; flex: 1 1 0; min-width: 190px; }
  .grant-item label { width: 42px; flex: none; color: #94a7bd; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin: 0; }
  .grant-item input { flex: 1; min-width: 80px; }
  .grant-item select { flex: 1; min-width: 80px; }
  /* ---- Character items (inventory / vault grids, 2026-11-15) ---- */
  .item-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 8px 0 4px; }
  .equip-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 8px 0 4px; }
  /* Equipment slots are a FIXED size; the item image inside resizes to
     fit (2026-11-15). */
  .equip-grid .item-cell { height: 72px; min-height: 72px; }
  /* Items view: 2 columns 50/50 — col 1 = equipment + inventory,
     col 2 = vault. Stacks to 1 column on narrow screens. */
  .items-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .items-col { min-width: 0; }
  @media (max-width: 720px) { .items-2col { grid-template-columns: 1fr; } }
  .item-cell { min-height: 38px; background: #0d1521; border: 1px solid #1d2a3c; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; line-height: 1.25; color: #e6edf7; text-align: center; padding: 2px; word-break: break-all; }
  .item-cell.empty { opacity: .3; }
  .item-cell.exc { border-color: #f59e0b; background: #2a1503; }
  .item-cell .mk { color: #fbbf24; font-size: 10px; }
  .item-sec { margin: 10px 0 4px; font-size: 13px; font-weight: 700; color: #9fb0c6; }
  .item-cell img { max-width: 100%; max-height: 100%; object-fit: contain; flex: 1 1 auto; min-height: 0; }
  /* ---- Item tooltip (game-accurate content, 2026-11-15) ---- */
  #item-tip { display: none; position: fixed; z-index: 9999; max-width: 320px; background: #0a0f16; border: 1px solid #f59e0b; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: #e6edf7; box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; }
  #item-tip .tip-name { font-weight: 800; font-size: 15px; color: #fbbf24; margin-bottom: 4px; }
  #item-tip .tip-line { color: #c7d2e4; }
  #item-tip .tip-blue { color: #60a5fa; }
  #item-tip .tip-yellow { color: #facc15; }
  #item-tip .tip-exc { color: #4ade80; margin-top: 4px; }
  #item-tip .tip-serial { color: #5f7288; font-size: 11px; margin-top: 6px; }
  /* ---- Grant wizard (thêm đồ vào kho, 2026-11-15) ---- */
  .vg-step { font-size: 13px; font-weight: 700; color: #fbbf24; margin: 12px 0 6px; }
  .vg-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 6px 0; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .vg-pick { background: #0d1521; border: 1px solid #1d2a3c; border-radius: 8px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; text-align: center; min-height: 64px; }
  .vg-pick:hover { border-color: #f59e0b; }
  .vg-pick.sel { border-color: #f59e0b; background: #2a1503; box-shadow: 0 0 0 2px rgba(245,158,11,.35); }
  .vg-pick img { max-width: 100%; max-height: 40px; object-fit: contain; }
  .vg-pick-name { font-size: 11px; line-height: 1.25; color: #e6edf7; word-break: break-word; }
  .vg-lines { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .vg-lines label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: #e6edf7; cursor: pointer; }
  .vg-exc-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 6px 22px; }
  .vg-exc-list label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: #7dd3fc; cursor: pointer; }
  .vg-summary { color: #e6edf7; font-size: 13.5px; }
  .vg-adv { margin-top: 14px; border-top: 1px solid #16202f; padding-top: 10px; }
  .vg-adv summary { cursor: pointer; font-size: 12.5px; color: #9fb0c6; font-weight: 700; }
  td input[type=number] { width: 110px; padding: 6px 8px; }
  tr.expired td { color: #f87171; }

  /* ---- Forms & buttons ---- */
  input, select, textarea { background: #0c131d; color: #e6edf7; border: 1px solid #1d2a3c; border-radius: 9px; padding: 9px 11px; font-family: inherit; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  input[type=number] { width: 130px; }
  input[type=checkbox] { accent-color: #f59e0b; width: 16px; height: 16px; vertical-align: -3px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.5; }
  button.btn { background: #2f6bff; color: #fff; border: 1px solid #2f6bff; border-radius: 9px; padding: 9px 15px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: filter .15s, transform .05s; }
  button.btn:hover { filter: brightness(1.12); }
  button.btn:active { transform: scale(.98); }
  button.btn.gold { background: #f59e0b; border-color: #f59e0b; color: #04070d; }
  button.btn.danger { background: #b91c1c; border-color: #b91c1c; }
  button.btn.ghost { background: #0e1622; color: #e6edf7; border: 1px solid #1d2a3c; }
  button.btn:disabled { opacity: .45; cursor: default; filter: none; }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .row label { font-size: 13px; color: #c7d2e4; font-weight: 600; }
  .warn { background: #2a1503; border: 1px solid #f59e0b; color: #fcd34d; border-radius: 12px; padding: 13px 14px; font-size: 13px; line-height: 1.55; margin: 10px 0; }
  .danger-box { background: #2a0a0a; border: 1px solid #b91c1c; color: #fca5a5; border-radius: 12px; padding: 13px 14px; font-size: 13px; line-height: 1.55; margin: 10px 0; }
  .note { color: #9fb0c6; font-size: 12.5px; line-height: 1.55; }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  .count-ok { color: #4ade80; font-weight: 700; }
  .count-over { color: #f87171; font-weight: 700; }
  #msg { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #121c2b; border: 1px solid #2f6bff; color: #e6edf7; padding: 12px 18px; border-radius: 12px; display: none; max-width: min(92vw, 560px); text-align: center; z-index: 50; font-size: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.55); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .pill.hot { background: #14532d; color: #4ade80; }
  .pill.restart { background: #3b2f0b; color: #fbbf24; }
  .pill.off { background: #3f1d1d; color: #f87171; }
  pre { background: #070b13; border: 1px solid #16202f; border-radius: 9px; padding: 10px; overflow: auto; font-size: 12px; max-height: 300px; }
  .subtabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .subtabs button { background: #0e1622; color: #e6edf7; border: 1px solid #1d2a3c; border-radius: 999px; padding: 7px 14px; font-family: inherit; font-weight: 600; cursor: pointer; }
  .subtabs button.active { background: #f59e0b; color: #04070d; border-color: #f59e0b; }
  .inline-form { background: #0c131d; border: 1px solid rgba(245,158,11,.5); border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .inline-form h3 { margin: 0 0 10px; font-size: 14px; color: #fbbf24; }

  .field { display: flex; flex-direction: column; gap: 5px; margin: 7px 0; }
  .field label { font-size: 12px; color: #9fb0c6; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  code { background: #0e1622; border: 1px solid #1d2a3c; border-radius: 5px; padding: 0 5px; font-size: .92em; }

  /* ---- Confirm modal (replaces the native browser dialog) ---- */
  #confirm-modal { position: fixed; inset: 0; background: rgba(2, 6, 12, .72); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .confirm-modal-box { background: #0a1018; border: 1px solid #f59e0b; border-radius: 14px; padding: 20px; max-width: 520px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  .confirm-modal-title { color: #fbbf24; font-size: 16px; font-weight: 800; letter-spacing: .3px; margin-bottom: 10px; }
  #confirm-modal-msg { color: #e6edf7; font-size: 14.5px; line-height: 1.6; white-space: pre-line; word-break: break-word; }
  .confirm-modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .side { width: 100%; height: auto; position: static; padding: 14px; }
    nav#tabs { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    nav#tabs button { flex: none; width: auto; }
    .nav-group { display: none; }
    .side-foot { flex-direction: row; }
    main { padding: 14px 12px 36px; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <h1>⚔️ QUẢN TRỊ MU ONLINE</h1>
      <div class="sub">MU Online — Admin</div>
    </div>
    <div class="who-chip" id="who"></div>
    <nav id="tabs">
    <button data-tab="overview" class="active"><span class="ic">📊</span>Tổng quan</button>
    <button data-tab="accounts"><span class="ic">👤</span>Tài khoản</button>
    <button data-tab="characters"><span class="ic">🧑</span>Nhân vật</button>
    <button data-tab="feedback"><span class="ic">💬</span>Góp ý</button>
    </nav>
    <div class="side-foot">
      <button class="btn ghost" onclick="location.href='/index.html'">← Về trang chủ</button>
      <button class="btn ghost" onclick="logout()">Đăng xuất</button>
    </div>
  </aside>
  <main>
  <section id="tab-overview" class="active">
    <div class="card"><h2>Tổng quan</h2><div class="grid" id="ov-stats"></div>
      <p class="note" id="ov-maint"></p></div>
  </section>


  <section id="tab-accounts">
    <div class="card"><h2>Tài khoản</h2>
      <div class="row"><input id="acc-q" placeholder="Tìm theo tên tài khoản…" style="flex:1;min-width:180px">
        <input id="acc-email" placeholder="Tìm theo email…" style="min-width:180px">
        <select id="acc-filter"><option value="">Tất cả</option><option value="banned">Đang khóa</option><option value="admin">Admin</option></select>
        <button class="btn" onclick="loadAccounts()">🔍 Tìm</button></div>
      <div id="acc-ban-form" class="inline-form" style="display:none"></div>
      <div id="acc-list"></div>
      <div id="acc-detail" style="display:none"></div></div>
  </section>




  <section id="tab-characters">
    <div class="card" id="char-list-card"><h2>Nhân vật</h2>
      <div class="row"><input id="char-q" placeholder="Tìm theo tên nhân vật…" style="flex:1;min-width:180px">
        <input id="char-account" placeholder="Tài khoản (tên hoặc ID)…" style="min-width:190px">
        <select id="char-class"><option value="">Mọi class</option><option value="0">DW</option><option value="16">DK</option><option value="32">Elf</option><option value="48">MG</option><option value="64">DL</option><option value="80">SU</option><option value="96">RF</option></select>
        <button class="btn" onclick="loadCharacters(0)">🔍 Tìm</button></div>
      <p class="note">Bấm vào một nhân vật trong bảng để xem chi tiết.</p>
      <div id="char-list"></div></div>
    <div id="char-detail" style="display:none"></div>
  </section>



  <section id="tab-feedback">
    <div class="card"><h2>Góp ý</h2>
      <div class="row">
        <select id="fb-filter-status"><option value="">Mọi trạng thái</option><option value="moi">Mới</option><option value="dang_xu_ly">Đang xử lý</option><option value="xong">Xong</option></select>
        <button class="btn" onclick="loadFeedback(0)">🔍 Tìm</button></div>
      <p class="note">Bấm vào một mục để xem chi tiết và đổi trạng thái.</p>
      <div id="fb-list"></div></div>
    <div id="fb-detail" style="display:none"></div>
  </section>






  </main>
</div>
<div id="msg"></div>
<div id="confirm-modal" style="display:none">
  <div class="confirm-modal-box">
    <div class="confirm-modal-title">⚠️ Xác nhận</div>
    <div id="confirm-modal-msg"></div>
    <div class="confirm-modal-actions">
      <button class="btn gold" id="confirm-modal-ok" type="button">OK</button>
      <button class="btn ghost" id="confirm-modal-cancel" type="button">Hủy</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var token = localStorage.getItem('mu_token') || localStorage.getItem('mu_user_token') || sessionStorage.getItem('mu_token');
  if (!token) { location.href = '/?login=1&next=' + encodeURIComponent('/admin.html'); return; }
  var msgTimer = null;
  function showMsg(t, ok) {
    var m = document.getElementById('msg');
    m.textContent = t; m.style.display = 'block';
    m.style.borderColor = ok === false ? '#b91c1c' : '#2f6bff';
    clearTimeout(msgTimer); msgTimer = setTimeout(function () { m.style.display = 'none'; }, 4500);
  }
  // ---- Custom confirm modal (replaces the native browser dialog): resolves true
  // on OK, false on Cancel / backdrop click / Escape. If called while a
  // previous confirm is still open, the previous one resolves false first.
  var confirmResolve = null;
  function onConfirmBackdrop(e) { if (e.target === document.getElementById('confirm-modal')) closeConfirm(false); }
  function onConfirmKey(e) { if (e.key === 'Escape') closeConfirm(false); }
  function closeConfirm(v) {
    if (!confirmResolve) return;
    var r = confirmResolve; confirmResolve = null;
    document.getElementById('confirm-modal').style.display = 'none';
    document.getElementById('confirm-modal').removeEventListener('click', onConfirmBackdrop);
    document.removeEventListener('keydown', onConfirmKey);
    r(v);

  window.confirmDlg = function (msg) {

    document.getElementById('confirm-modal-msg').textContent = msg;

    document.getElementById('confirm-modal-ok').onclick = function () { closeConfirm(true); };
    document.getElementById('confirm-modal-cancel').onclick = function () { closeConfirm(false); };
    modal.addEventListener('click', onConfirmBackdrop);

    return new Promise(function (resolve) { confirmResolve = resolve; });

  // Đăng xuất → trang chủ + modal đăng nhập (không `next`: như trang đăng
  // nhập riêng cũ, đăng nhập xong về '/' chứ không tự quay lại trang quản trị).
  window.logout = function () {
    localStorage.removeItem('mu_token'); localStorage.removeItem('mu_user_token'); localStorage.removeItem('mu_user');
    sessionStorage.removeItem('mu_token'); location.href = '/?login=1';
  };
  function headers() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }
  async function api(method, path, body) {
    var r = await fetch(path, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
    var d = null; try { d = await r.json(); } catch (e) { d = { success: false, message: 'Server trả về dữ liệu không phải JSON (HTTP ' + r.status + ')' }; }
    // 401 = token đã chết: xóa token cũ TRƯỚC khi chuyển về modal đăng nhập,
    // nếu không trang chủ thấy token còn đó sẽ tưởng đã đăng nhập mà đẩy
    // thẳng về /admin.html rồi lại 401 (lặp vô hạn).
    if (r.status === 401) { showMsg('Phiên đăng nhập hết hạn — chuyển về trang đăng nhập…', false); localStorage.removeItem('mu_token'); localStorage.removeItem('mu_user_token'); localStorage.removeItem('mu_user'); sessionStorage.removeItem('mu_token'); setTimeout(function () { location.href = '/?login=1&next=' + encodeURIComponent('/admin.html'); }, 1200); }
    if (r.status === 403 && !d.success) showMsg(d.message || 'Không có quyền.', false);
    return { status: r.status, data: d };
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---- Notice ----
  function noticeByteLen(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length; } }
  // Vietnamese diacritics break the in-game notice rendering, so they are
  // blocked client-side (Bach 2026-11-15). NFD splits tone/horn/breve marks
  // into U+0300-036F; đ/Đ never decompose, ơ/ư bases are listed explicitly.
  function noticeHasAccents(s) {
    if (/[\u0110\u0111\u01A0\u01A1\u01AF\u01B0]/.test(s)) return true;
    return /[\u0300-\u036F]/.test(s.normalize('NFD'));
  }
  function noticeStripAccents(s) {
    return s.replace(/\u0110/g, 'D').replace(/\u0111/g, 'd')
      .normalize('NFD').replace(/[\u0300-\u036F]/g, '').normalize('NFC');
  }
  window.stripNoticeAccents = function () {
    var el = document.getElementById('notice-msg');
    el.value = noticeStripAccents(el.value);
    updateNoticeCount();
    el.focus();
  };
  window.updateNoticeCount = function () {
    var v = document.getElementById('notice-msg').value;
    var chars = v.length, bytes = noticeByteLen(v);
    var acc = noticeHasAccents(v);
    var el = document.getElementById('notice-count');
    el.innerHTML = '<span class="' + (chars > 128 ? 'count-over' : 'count-ok') + '">' + chars + ' / 128 ký tự</span> · ' +
      '<span class="' + (bytes > 250 ? 'count-over' : 'count-ok') + '">' + bytes + ' / 250 byte UTF-8</span>' +
      (chars > 128 || bytes > 250 ? ' — <span class="bad">vượt giới hạn, không gửi được</span>' : '') +
      (acc ? ' — <span class="bad">có tiếng Việt có dấu, vào game sẽ lỗi — bấm “Bỏ dấu” hoặc gõ lại không dấu</span>' : '');
    document.getElementById('notice-send').disabled = chars > 128 || bytes > 250 || !v.trim() || acc;
  };
  window.clearNotice = function () {
    document.getElementById('notice-msg').value = '';
    document.getElementById('notice-target').value = '';
    document.getElementById('notice-result').textContent = '';
    updateNoticeCount();
  };
  window.sendNotice = async function () {
    var msg = document.getElementById('notice-msg').value;
    var type = Number(document.getElementById('notice-type').value);
    var realm = document.getElementById('notice-realm').value;
    var target = document.getElementById('notice-target').value.trim();
    if (!msg.trim()) { showMsg('Nhập nội dung thông báo trước.', false); return; }
    if (noticeHasAccents(msg)) { showMsg('Thông báo có tiếng Việt có dấu — vào game sẽ lỗi. Hãy bỏ dấu trước khi gửi.', false); return; }
    if (msg.length > 128) { showMsg('Thông báo vượt 128 ký tự (hiện ' + msg.length + ').', false); return; }
    if (noticeByteLen(msg) > 250) { showMsg('Thông báo vượt 250 byte UTF-8 (hiện ' + noticeByteLen(msg) + ').', false); return; }
    var typeName = ['Banner', 'Chat log', 'Guild'][type];
    var realmName = realm === 'all' ? 'Cả hai realm' : realm;
    if (!await confirmDlg('Gửi thông báo?\n\nNội dung: ' + msg + '\nLoại: ' + typeName + '\nPhạm vi: ' + realmName + (target ? '\nĐích: ' + target : '\nĐích: toàn server'))) return;
    var body = { message: msg, type: type, realm: realm };
    if (target) body.target = target;
    var r = await api('POST', '/api/admin/notice', body);
    if (r.data && r.data.success) {
      var delivered = r.data.delivered;
      document.getElementById('notice-result').innerHTML = '<span class="ok">Đã gửi tới ' + delivered + ' người đang online.</span>';
      showMsg('Đã gửi tới ' + delivered + ' người đang online.');
    } else {
      document.getElementById('notice-result').innerHTML = '<span class="bad">' + esc(r.data && r.data.message || 'Gửi thất bại.') + ' (HTTP ' + r.status + ')</span>';
      showMsg(r.data && r.data.message || 'Gửi thông báo thất bại.', false);
    }
  };

  // ---- Accounts ----
  var accCache = {};

  async function loadAccounts(page) {
    if (typeof page === 'number' && page >= 0) accPage = page;
    var q = document.getElementById('acc-q').value.trim();
    var email = document.getElementById('acc-email').value.trim();
    var filter = document.getElementById('acc-filter').value;
    var qs = '/api/admin/accounts?limit=' + ACC_PAGE_SIZE + '&offset=' + (accPage * ACC_PAGE_SIZE);
    if (q) qs += '&q=' + encodeURIComponent(q);
    if (email) qs += '&email=' + encodeURIComponent(email);
    if (filter === 'banned') qs += '&banned=true';
    if (filter === 'admin') qs += '&is_admin=true';
    var r = await api('GET', qs);
    if (!r.data || !r.data.success) { showMsg(r.data && r.data.message || 'Không tải được tài khoản.', false); return; }
    var total = r.data.total || 0;
    var pages = Math.max(1, Math.ceil(total / ACC_PAGE_SIZE));
    if (accPage > pages - 1) { accPage = pages - 1; return loadAccounts(); }
    accCache = {};

        '<button class="btn gold" onclick="showResetPwForm(\'' + a.id + '\')">Đặt lại MK</button>' +
        '</td></tr>';

  window.showResetPwForm = function (id) {

  // Grid from slot_x/slot_y (server provides bag coords for inventory,
  // vault coords for the vault). `slots` = total cells (64 or 120).
  // Game-accurate: each item spans its real Width x Height from Item.txt
  // (pants/boots 2x2, armor 2x2/2x3, swords 1x3/2x4, jewels 1x1, ...),
  // placed at its exact slot with explicit grid-column/grid-row so the
  // positions match the game. Cells covered by a multi-cell item are
  // skipped (they belong to that item, not empty).
  function renderItemGrid(items, slots) {
    var byPos = {};
    var covered = {};
    (items || []).forEach(function (it) {
      if (it.slot_x == null || it.slot_y == null) return;
      var sz = itemSize(it);
      var w = sz[0], h = sz[1];
      if (it.slot_x + w > 8) w = 8 - it.slot_x; // clamp to grid width
      if (w < 1) w = 1;
      byPos[it.slot_y * 8 + it.slot_x] = { it: it, x: it.slot_x + 1, y: it.slot_y + 1, w: w, h: h };
      for (var dy = 0; dy < h; dy++) {
        for (var dx = 0; dx < w; dx++) {
          if (dx === 0 && dy === 0) continue;
          covered[(it.slot_y + dy) * 8 + (it.slot_x + dx)] = true;
        }
      }
    });
    var h = '<div class="item-grid">';
    for (var s = 0; s < slots; s++) {
      if (covered[s]) continue;
      var e = byPos[s];
      if (e) h += itemCellHtml(e.it, { x: e.x, y: e.y, w: e.w, h: e.h });

  function vgExcLinesForSection(sec) {

  // Excellent bitmask from the wizard controls.

  function vgComputeExc() {

    var bits = 0;

  // ---- Events ----
  var eventsCache = {};
  async function loadEvents() {
    var r = await api('GET', '/api/admin/events');
    var box = document.getElementById('events-list');
    var tzEl = document.getElementById('events-tz');
    if (!r.data || !r.data.success) {
      tzEl.textContent = 'Chưa tải được lịch sự kiện (endpoint GET /api/admin/events chưa có — chờ backend). Hiển thị mặc định: mỗi 2 giờ vào giờ chẵn, mở cửa trước 15 phút, cấp tối thiểu 10.';
      var def = { interval_hours: 2, minute: 0, entry_minutes_before: 15, min_level: 10, allow_killers: false, enabled: true };
      box.innerHTML = eventCard('blood_castle', 'Blood Castle', def, '—') + eventCard('devil_square', 'Devil Square', def, '—');
      return;
    }
    // Backend GET /api/admin/events trả {event_timezone, events: [{type, ..., next_start}]}
    // (mảng, không phải map event_schedule/next_start như bản nháp đầu — xem MERGE-NOTES).
    // Dựng map từ mảng events; giữ fallback event_schedule/next_start nếu API đổi dạng.
    var sched = {};
    if (Array.isArray(r.data.events)) {
      r.data.events.forEach(function (e) { if (e && e.type) sched[e.type] = e; });
    } else {
      sched = r.data.event_schedule || r.data.schedules || {};
    }
    var nexts = {};
    Object.keys(sched).forEach(function (t) { if (sched[t] && sched[t].next_start) nexts[t] = sched[t].next_start; });
    if (r.data.next_start) nexts = r.data.next_start;
    tzEl.textContent = 'Múi giờ sự kiện: ' + (r.data.event_timezone || 'UTC') + ' (đổi ở tab Cấu hình).';
    eventsCache = sched;
    box.innerHTML = eventCard('blood_castle', 'Blood Castle', sched.blood_castle || {}, nexts.blood_castle || '') +
      eventCard('devil_square', 'Devil Square', sched.devil_square || {}, nexts.devil_square || '');
  }
  function eventCard(type, label, s, nextStart) {
    var en = s.enabled !== false;
    return '<div class="card"><h3>' + label + ' <span class="pill ' + (en ? 'hot' : 'off') + '">' + (en ? 'ĐANG BẬT' : 'ĐANG TẮT') + '</span></h3>' +
      '<div class="formgrid">' +
      '<div class="field"><label>Bật/tắt</label><select id="ev-' + type + '-enabled"><option value="true"' + (en ? ' selected' : '') + '>Bật</option><option value="false"' + (!en ? ' selected' : '') + '>Tắt</option></select></div>' +
      '<div class="field"><label>Chu kỳ (giờ, ước của 24: 1/2/3/4/6/8/12/24)</label><input type="number" id="ev-' + type + '-interval" min="1" max="24" value="' + (s.interval_hours != null ? s.interval_hours : 2) + '"></div>' +
      '<div class="field"><label>Phút bắt đầu (0–59)</label><input type="number" id="ev-' + type + '-minute" min="0" max="59" value="' + (s.minute != null ? s.minute : 0) + '"></div>' +
      '<div class="field"><label>Mở cửa trước (phút, 0–60)</label><input type="number" id="ev-' + type + '-entry" min="0" max="60" value="' + (s.entry_minutes_before != null ? s.entry_minutes_before : 15) + '"></div>' +
      '<div class="field"><label>Cấp tối thiểu (1–350)</label><input type="number" id="ev-' + type + '-minlevel" min="1" max="350" value="' + (s.min_level != null ? s.min_level : 10) + '"></div>' +
      '<div class="field"><label>Cho phép PK</label><select id="ev-' + type + '-pk"><option value="false"' + (!s.allow_killers ? ' selected' : '') + '>Không</option><option value="true"' + (s.allow_killers ? ' selected' : '') + '>Có</option></select></div></div>' +
      '<p class="note">Giờ tiếp theo (theo múi giờ đã chọn): <b>' + (nextStart ? fmtDate(nextStart) : '— (chưa tính được)') + '</b></p>' +
      '<div class="row"><button class="btn gold" onclick="saveEvent(\'' + type + '\')">💾 Lưu lịch ' + label + '</button></div></div>';
  }
  window.saveEvent = async function (type) {
    var interval = Number(document.getElementById('ev-' + type + '-interval').value);
    var minute = Number(document.getElementById('ev-' + type + '-minute').value);
    var entry = Number(document.getElementById('ev-' + type + '-entry').value);
    var minLevel = Number(document.getElementById('ev-' + type + '-minlevel').value);
    if ([1, 2, 3, 4, 6, 8, 12, 24].indexOf(interval) < 0) { showMsg('Chu kỳ giờ phải là ước của 24 (1, 2, 3, 4, 6, 8, 12, 24).', false); return; }
    if (!(minute >= 0 && minute <= 59 && entry >= 0 && entry <= 60 && minLevel >= 1 && minLevel <= 350)) { showMsg('Kiểm tra lại các giá trị (phút 0–59, mở cửa trước 0–60, cấp 1–350).', false); return; }
    var body = { config: {} };
    body.config['event_schedule.' + type] = {
      enabled: document.getElementById('ev-' + type + '-enabled').value === 'true',
      interval_hours: interval, minute: minute, entry_minutes_before: entry,
      min_level: minLevel, allow_killers: document.getElementById('ev-' + type + '-pk').value === 'true'
    };
    var r = await api('POST', '/api/admin/config', body);
    if (r.data && r.data.success) { showMsg('Đã lưu lịch sự kiện ' + type + ' (HOT — có hiệu lực ngay).'); loadEvents(); }
    else showMsg(r.data && r.data.message || 'Lưu lịch sự kiện thất bại.', false);
  };

      h += '<tr><td>' + (it.sort_order != null ? it.sort_order : i) + '</td><td>' + esc(it.id) + '</td><td>' + esc(it.label_vi) + '</td><td>' + esc(it.label_en || '') +
        '</td><td>' + esc(it.href) + '</td><td>' + (it.visible ? '<span class="ok">Hiện</span>' : '<span class="bad">Ẩn</span>') + '</td><td>' +
        '<button class="btn ghost" onclick="moveMenuItem(' + JSON.stringify(it.id) + ',-1)"' + (i === 0 ? ' disabled' : '') + '>↑</button> ' +
        '<button class="btn ghost" onclick="moveMenuItem(' + JSON.stringify(it.id) + ',1)"' + (i === sorted.length - 1 ? ' disabled' : '') + '>↓</button> ' +
        '<button class="btn ghost" onclick="editMenuItem(' + JSON.stringify(it.id) + ')">Sửa</button> ' +
        '<button class="btn danger" onclick="deleteMenuItem(' + JSON.stringify(it.id) + ')">Xóa</button></td></tr>';
    });
    box.innerHTML = h + '</table>';
  }
  window.editMenuItem = function (id) {
    var it = null;
    menuCache.forEach(function (m) { if (m.id === id) it = m; });
    if (!it) return;
    menuEditingId = id;
    document.getElementById('menu-id').value = it.id;
    document.getElementById('menu-label-vi').value = it.label_vi || '';
    document.getElementById('menu-label-en').value = it.label_en || '';
    document.getElementById('menu-href').value = it.href || '';
    document.getElementById('menu-sort').value = it.sort_order != null ? it.sort_order : 0;
    document.getElementById('menu-visible').checked = !!it.visible;
    document.getElementById('menu-editing').style.display = '';
    document.getElementById('menu-editing-id').textContent = id;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  window.clearMenuForm = function () {
    menuEditingId = null;
    ['menu-id', 'menu-label-vi', 'menu-label-en', 'menu-href'].forEach(function (x) { document.getElementById(x).value = ''; });
    document.getElementById('menu-sort').value = 0;
    document.getElementById('menu-visible').checked = true;
    document.getElementById('menu-editing').style.display = 'none';
  };
  async function saveWholeMenu(menu) {
    var r = await api('PUT', '/api/admin/nav-menu', { menu: menu });
    if (r.data && r.data.success) { showMsg(r.data.message || 'Đã lưu menu.'); loadNavMenu(); }
    else showMsg(r.data && r.data.message || 'Lưu menu thất bại.', false);
  }
  window.saveMenuItem = async function () {
    var id = document.getElementById('menu-id').value.trim();
    var labelVi = document.getElementById('menu-label-vi').value.trim();
    var labelEn = document.getElementById('menu-label-en').value.trim();
    var href = document.getElementById('menu-href').value.trim();
    var sort = Number(document.getElementById('menu-sort').value);
    var visible = document.getElementById('menu-visible').checked;
    if (!/^[a-z0-9_-]{1,32}$/.test(id)) { showMsg('ID phải là slug [a-z0-9_-], tối đa 32 ký tự.', false); return; }
    if (!labelVi || labelVi.length > 50) { showMsg('Nhãn VI bắt buộc, tối đa 50 ký tự.', false); return; }
    if (!href || !(/^\/|^https?:\/\//.test(href))) { showMsg('Href phải bắt đầu bằng / hoặc http(s):// (không cho javascript:).', false); return; }
    var menu = menuCache.slice();
    var item = { id: id, label_vi: labelVi, label_en: labelEn || null, href: href, visible: visible, sort_order: sort };
    var idx = -1;
    menu.forEach(function (m, i) { if (m.id === (menuEditingId || id)) idx = i; });
    if (menuEditingId && menuEditingId !== id) { showMsg('Không đổi được ID của mục đang sửa — xóa mục cũ rồi thêm mục mới nếu cần đổi ID.', false); return; }
    if (idx >= 0) menu[idx] = item;
    else {
      if (menu.some(function (m) { return m.id === id; })) { showMsg('ID "' + id + '" đã tồn tại.', false); return; }
      menu.push(item);
    }
    if (menu.length > 12) { showMsg('Tối đa 12 mục menu.', false); return; }
    await saveWholeMenu(menu);
    clearMenuForm();
  };
  window.deleteMenuItem = async function (id) {
    if (!await confirmDlg('Xóa mục menu "' + id + '"?')) return;
    var menu = menuCache.filter(function (m) { return m.id !== id; });
    await saveWholeMenu(menu);
  };
  window.moveMenuItem = async function (id, dir) {
    var sorted = menuCache.slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
    var i = -1;
    sorted.forEach(function (m, k) { if (m.id === id) i = k; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= sorted.length) return;
    var tmp = sorted[i].sort_order;
    sorted[i].sort_order = sorted[j].sort_order;
    sorted[j].sort_order = tmp;
    await saveWholeMenu(sorted);
  };

  // ---- Audit ----
  var AUDIT_EVENTS = ['login', 'login_failed', 'password_changed', 'admin_ban', 'admin_unban', 'admin_grant_admin', 'admin_revoke_admin', 'admin_grant_zen', 'admin_grant_points', 'admin_teleport', 'admin_notice', 'admin_config_change', 'admin_shop_item_upsert', 'admin_shop_item_delete', 'admin_news_create', 'admin_news_update', 'admin_news_delete', 'admin_balance_adjust', 'admin_password_reset', 'admin_item_award', 'admin_block_serial', 'admin_unblock_serial', 'admin_character_update', 'admin_modules_change', 'admin_nav_menu_change', 'admin_shutdown'];
  var auditOffset = 0, auditTotal = 0;
  var auditSub = 'audit';
  var aloginOffset = 0, aloginTotal = 0;
  (function fillAuditEvents() {
    var sel = document.getElementById('audit-event');
    AUDIT_EVENTS.forEach(function (e) {
      var o = document.createElement('option');
      o.value = e; o.textContent = e;
      sel.appendChild(o);
    });
  })();
  window.switchAuditSub = function (sub) {
    auditSub = sub;
    document.getElementById('sub-audit').classList.toggle('active', sub === 'audit');
    document.getElementById('sub-adminlogins').classList.toggle('active', sub === 'adminlogins');
    document.getElementById('sub-dupe').classList.toggle('active', sub === 'dupe');
    document.getElementById('audit-main').style.display = sub === 'audit' ? '' : 'none';
    document.getElementById('audit-adminlogins').style.display = sub === 'adminlogins' ? '' : 'none';
    document.getElementById('audit-dupe').style.display = sub === 'dupe' ? '' : 'none';
    if (sub === 'adminlogins') loadAdminLogins();
    else if (sub === 'dupe') loadDupeLog();
    else loadAudit();
  };
  window.auditResetPage = function () { auditOffset = 0; };
  window.auditPrev = function () { if (auditOffset >= 50) { auditOffset -= 50; loadAudit(); } };
  window.auditNext = function () { if (auditOffset + 50 < auditTotal) { auditOffset += 50; loadAudit(); } };
  async function loadAudit() {
    var qs = '/api/admin/audit?limit=50&offset=' + auditOffset;
    var ev = document.getElementById('audit-event').value;
    var acc = document.getElementById('audit-account').value.trim();
    var ch = document.getElementById('audit-char').value.trim();
    var realm = document.getElementById('audit-realm').value;
    var from = document.getElementById('audit-from').value;
    var to = document.getElementById('audit-to').value;
    if (ev) qs += '&event_type=' + encodeURIComponent(ev);
    if (acc) qs += '&account_id=' + encodeURIComponent(acc);
    if (ch) qs += '&character_name=' + encodeURIComponent(ch);
    if (realm) qs += '&realm_code=' + encodeURIComponent(realm);
    if (from) qs += '&from=' + encodeURIComponent(from);
    if (to) qs += '&to=' + encodeURIComponent(to);
    var r = await api('GET', qs);
    if (!r.data || !r.data.success) { showMsg(r.data && r.data.message || 'Không tải được audit.', false); return; }
    auditTotal = r.data.total || 0;
    document.getElementById('audit-list').innerHTML = '<p class="note">Tổng: ' + auditTotal + ' dòng.</p>' + auditTable(r.data.audit || []);
    document.getElementById('audit-page').textContent = 'Trang ' + (Math.floor(auditOffset / 50) + 1) + ' — đang xem ' + (auditOffset + 1) + '–' + Math.min(auditOffset + 50, auditTotal) + ' / ' + auditTotal;
    document.getElementById('audit-prev').disabled = auditOffset === 0;
    document.getElementById('audit-next').disabled = auditOffset + 50 >= auditTotal;
  }
  window.aloginResetPage = function () { aloginOffset = 0; };
  window.aloginPrev = function () { if (aloginOffset >= 50) { aloginOffset -= 50; loadAdminLogins(); } };
  window.aloginNext = function () { if (aloginOffset + 50 < aloginTotal) { aloginOffset += 50; loadAdminLogins(); } };
  async function loadAdminLogins() {
    var qs = '/api/admin/admin-logins?limit=50&offset=' + aloginOffset;
    var ok = document.getElementById('alogin-success').value;
    var user = document.getElementById('alogin-user').value.trim();
    if (ok !== '') qs += '&success=' + encodeURIComponent(ok);
    if (user) qs += '&username=' + encodeURIComponent(user);
    var r = await api('GET', qs);
    var box = document.getElementById('alogin-list');
    if (!r.data || !r.data.success) { box.innerHTML = '<p class="note">Chưa tải được log đăng nhập admin' + (r.data && r.data.message ? ': ' + esc(r.data.message) : ' (endpoint GET /api/admin/admin-logins chưa có — chờ backend).') + '</p>'; return; }
    aloginTotal = r.data.total || 0;
    var rows = r.data.logins || [];
    if (!rows.length) { box.innerHTML = '<p class="note">Chưa có lần đăng nhập admin nào.</p>'; return; }
    var h = '<p class="note">Tổng: ' + aloginTotal + ' lần.</p><table><tr><th>Thời gian</th><th>Admin</th><th>Kết quả</th><th>Lý do</th><th>IP</th></tr>';
    rows.forEach(function (l) {
      h += '<tr><td>' + fmtDate(l.created_at) + '</td><td>' + esc(l.username || ('#' + l.account_id)) + '</td><td>' +
        (l.success ? '<span class="ok">Thành công</span>' : '<span class="bad">Thất bại</span>') + '</td><td>' + esc(l.reason || '—') +
        '</td><td>' + esc(l.ip || '—') + '</td></tr>';
    });
    box.innerHTML = h + '</table>';
    document.getElementById('alogin-page').textContent = 'Trang ' + (Math.floor(aloginOffset / 50) + 1) + ' — đang xem ' + (aloginOffset + 1) + '–' + Math.min(aloginOffset + 50, aloginTotal) + ' / ' + aloginTotal;
    document.getElementById('alogin-prev').disabled = aloginOffset === 0;
    document.getElementById('alogin-next').disabled = aloginOffset + 50 >= aloginTotal;
  }


  // ANTI-DUPE (migration 029): nhật ký dupe.
  var dupeOffset = 0, dupeTotal = 0;
  window.dupeResetPage = function () { dupeOffset = 0; };
  window.dupePrev = function () { if (dupeOffset >= 50) { dupeOffset -= 50; loadDupeLog(); } };
  window.dupeNext = function () { if (dupeOffset + 50 < dupeTotal) { dupeOffset += 50; loadDupeLog(); } };
  window.runDupeScanManual = async function () {
    if (!await confirmDlg('Chạy quét dupe toàn bộ blob ngay bây giờ? Nếu phát hiện đồ trùng thật, hệ thống sẽ khóa acc + đổi mật khẩu theo chính sách chống dupe.')) return;
    var r = await api('GET', '/api/admin/dupe-scan');
    if (!r.data || !r.data.success) { showMsg(r.data && r.data.message || 'Không chạy được quét dupe.', false); return; }
    var b = r.data.blob || {};
    document.getElementById('dupe-scan-info').innerHTML = '<p class="note">Quét lúc ' + esc(r.data.scanned_at) + ': ' + b.accounts + ' acc, ' + b.items + ' đồ trong blob, ' + (b.duplicates ? b.duplicates.length : 0) + ' nhóm trùng, ' + (b.incidents_created || 0) + ' vụ mới, ' + (b.null_serial_count || 0) + ' đồ không serial.</p>';
    loadDupeLog();
  };
  async function loadDupeLog() {
    var qs = '/api/admin/dupe-log?limit=50&offset=' + dupeOffset;
    var s = document.getElementById('dupe-serial').value.trim();
    var a = document.getElementById('dupe-account').value.trim();
    var f = document.getElementById('dupe-from').value;
    var t = document.getElementById('dupe-to').value;
    var st = document.getElementById('dupe-status').value;
    if (s) qs += '&serial=' + encodeURIComponent(s);
    if (a) qs += '&account=' + encodeURIComponent(a);
    if (f) qs += '&from=' + encodeURIComponent(f);
    if (t) qs += '&to=' + encodeURIComponent(t);
    if (st) qs += '&status=' + encodeURIComponent(st);
    var r = await api('GET', qs);
    if (!r.data || !r.data.success) { showMsg(r.data && r.data.message || 'Không tải được nhật ký dupe.', false); return; }
    dupeTotal = r.data.total || 0;
    document.getElementById('dupe-list').innerHTML = '<p class="note">Tổng: ' + dupeTotal + ' vụ.</p>' + dupeTable(r.data.incidents || []);
    document.getElementById('dupe-page').textContent = 'Trang ' + (Math.floor(dupeOffset / 50) + 1) + ' — đang xem ' + (dupeOffset + 1) + '–' + Math.min(dupeOffset + 50, dupeTotal) + ' / ' + dupeTotal;
    document.getElementById('dupe-prev').disabled = dupeOffset === 0;
    document.getElementById('dupe-next').disabled = dupeOffset + 50 >= dupeTotal;
  }
  function dupeTable(list) {
    if (!list.length) return '<p class="note">Chưa có vụ dupe nào.</p>';
    return '<table class="tbl"><thead><tr><th>#</th><th>Thời gian</th><th>Serial</th><th>Đồ</th><th>Acc / nhân vật (vị trí)</th><th>Hành động</th><th>Trạng thái</th><th></th></tr></thead><tbody>' + list.map(function (r) {
      var id = r.identity || {};
      var item = 'type ' + id.type + ' / idx ' + id.index + ' (sec ' + id.section + ') Lv' + id.level +
        (id.skill ? ' skill' : '') + (id.luck ? ' luck' : '') + ' opt+' + (id.option || 0) +
        (id.excellent ? ' exl[' + id.excellent + ']' : '');
      var accs = (r.accounts || []).map(function (a) {
        var pw = a.new_password ? ' — <b>MK mới: ' + esc(a.new_password) + '</b>' : (a.password_cleared ? ' — MK đã giao' : '');
        var why = a.admin_skipped ? ' (admin, KHÔNG khóa)' : (a.already_banned ? ' (đã khóa từ trước)' : ' (đã khóa)');
        return esc(a.username || ('acc#' + a.account_id)) + ' #' + a.account_id +
          (a.character_name ? ' / ' + esc(a.character_name) : '') +
          ' [' + esc(a.location || '') + ' slot ' + a.slot + ']' + why + pw;
      }).join('<br>');
      var acts = (r.actions || []).map(function (x) { return esc(String(x)); }).join(', ');
      var btns = '';
      if (r.status === 'open') btns += '<button class="btn ghost" onclick="dupeReview(' + r.id + ',\'reviewed\')">Đã xem</button> ';
      if (r.status !== 'resolved') btns += '<button class="btn ghost" onclick="dupeReview(' + r.id + ',\'resolved\')">Đã xử lý</button> ';
      if ((r.accounts || []).some(function (a) { return a.new_password; })) btns += '<button class="btn ghost" onclick="dupeReview(' + r.id + ',\'clear_passwords\')">Đã giao MK</button>';
      return '<tr><td>' + r.id + '</td><td>' + esc(fmtDate(r.created_at)) + '</td><td>' + esc(String(r.serial)) + '</td><td>' + esc(item) + '</td><td>' + accs + '</td><td>' + acts + '</td><td>' + esc(r.status) + '</td><td>' + btns + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  window.dupeReview = async function (id, action) {
    var label = action === 'clear_passwords' ? 'Xóa mật khẩu mới khỏi bản ghi (chỉ bấm SAU KHI đã đưa MK cho chủ sở hữu)?' : (action === 'resolved' ? 'Đánh dấu vụ này đã xử lý?' : 'Đánh dấu đã xem?');
    if (!await confirmDlg(label)) return;
    var r = await api('POST', '/api/admin/dupe-log/' + id + '/review', { action: action });
    if (!r.data || !r.data.success) { showMsg(r.data && r.data.message || 'Không cập nhật được.', false); return; }
    showMsg(r.data.message || 'Đã cập nhật.', true);
    loadDupeLog();
  };

  // ---- Auth check + first load ----
  (async function init() {
    var me = await api('GET', '/api/admin/me');
    if (!me.data || !me.data.success) {
      document.body.innerHTML = '<main><div class="card"><h2>Không có quyền quản trị</h2>' +
        '<p>Tài khoản <b>' + esc(token.slice(0, 8)) + '…</b> không phải admin, hoặc phiên đăng nhập đã hết hạn.</p>' +
        '<p><a href="/?login=1&next=%2Fadmin.html">← Đăng nhập bằng tài khoản admin</a></p></div></main>';
      return;
    }
    document.getElementById('who').textContent = 'Đăng nhập: ' + me.data.username + ' (admin)';
    loadOverview();
  })();
})();
</script>
<div id="item-tip"></div>
</body>
